<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — GlobeLine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --hostinger: #673DE6;
      --hostinger-dark: #4C1D95;
      --twilio-red: #F22F46;
      --twilio-blue: #0263E0;
      --bg: #F6F4FF;
      --border: #E8E5FF;
      --muted: #64748B;
      --navy: #0B1220;
    }
    body {
      font-family: Inter, system-ui, sans-serif;
      max-width: 880px;
      margin: 40px auto;
      padding: 0 20px 60px;
      line-height: 1.75;
      color: var(--navy);
      background: var(--bg);
    }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(76, 29, 149, 0.06);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--hostinger), var(--twilio-blue), var(--twilio-red));
    }
    a { color: var(--hostinger); text-decoration: none; font-weight: 600; }
    a:hover { color: var(--hostinger-dark); }
    h1, h2 { color: var(--hostinger-dark); }
    h1 { margin: 12px 0 8px; }
    h2 { margin-top: 28px; margin-bottom: 8px; }
    .box {
      background: linear-gradient(135deg, #EDE9FE, #DBEAFE);
      border: 1px solid #C4B5FD;
      border-left: 4px solid var(--twilio-red);
      padding: 20px;
      border-radius: 14px;
      margin: 20px 0;
    }
    ul { padding-left: 20px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <p><a href="index.html">← Back to home</a></p>
    <h1>Support</h1>
    <p>Need help with your account, payments, or number purchase?</p>

    <div class="box">
      <p><strong>Email:</strong> <a href="mailto:support@globeline.online">support@globeline.online</a></p>
      <p style="color:#64748B; margin-top:8px;">We aim to respond within 24–48 hours.</p>
    </div>

    <h2>Common topics</h2>
    <ul>
      <li>Wallet top-ups</li>
      <li>Number delivery issues</li>
      <li>Account access</li>
      <li>Refund requests</li>
    </ul>
  </div>
</body>
</html>
